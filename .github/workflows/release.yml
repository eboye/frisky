name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (for a manual run)
        required: true

env:
  CARGO_TERM_COLOR: always

# Read-only by default; only the publish job below widens this to write, so the
# three build jobs cannot alter the repository even if a build step misbehaves.
permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit rather than @master: this action runs privileged in a
      # container with access to the checkout, and the upstream repo publishes
      # no release tags to track instead.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: frisky.flatpak
          manifest-path: build-aux/io.github.eboye.Frisky.json
          cache-key: flatpak-builder-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: frisky.flatpak

  appimage:
    name: AppImage and tarball
    runs-on: ubuntu-24.04
    # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, which clear the crate's
    # minimums. Building here rather than in the Flatpak runtime keeps the
    # AppImage's glibc requirement as low as the runner allows.
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            desktop-file-utils appstream librsvg2-bin \
            libglib2.0-bin patchelf \
            libgdk-pixbuf2.0-bin librsvg2-common \

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked

      - name: Stage install tree
        run: |
          ./build-aux/install.sh "${{ github.workspace }}/AppDir/usr"
          # AppImage wants the desktop entry and icon at the AppDir root too.
          cp AppDir/usr/share/applications/io.github.eboye.Frisky.desktop AppDir/
          cp AppDir/usr/share/icons/hicolor/scalable/apps/io.github.eboye.Frisky.svg AppDir/
          rsvg-convert -w 256 -h 256 \
            AppDir/usr/share/icons/hicolor/scalable/apps/io.github.eboye.Frisky.svg \
            -o AppDir/io.github.eboye.Frisky.png

      - name: Determine version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Binary tarball
        run: |
          mkdir -p dist
          tar -C AppDir/usr -czf \
            "dist/frisky-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz" .

      - name: Build AppImage
        # Bundles GTK, libadwaita and GStreamer so the AppImage runs without
        # those installed on the host.
        env:
          DEPLOY_GTK_VERSION: "4"
        run: |
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gtk \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          curl -fsSL -o linuxdeploy-plugin-gstreamer \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk linuxdeploy-plugin-gstreamer
          # linuxdeploy resolves --plugin names from PATH.
          export PATH="$PWD:$PATH"

          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --executable AppDir/usr/bin/frisky-gtk \
            --desktop-file AppDir/usr/share/applications/io.github.eboye.Frisky.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/io.github.eboye.Frisky.svg \
            --plugin gtk --plugin gstreamer

          # The plugins target GTK3 and Debian's multiarch paths; this corrects
          # both. Must land after they run, hence the name and the second pass.
          install -Dm755 build-aux/appimage-apprun-hook.sh \
            AppDir/apprun-hooks/zz-frisky-fixups.sh

          ./linuxdeploy --appimage-extract-and-run --appdir AppDir --output appimage

          mkdir -p dist
          mv Frisky*.AppImage \
            "dist/Frisky-${{ steps.version.outputs.version }}-x86_64.AppImage"

      - name: Check the AppImage is self-contained
        run: |
          # A stale GTK_THEME or a dead scanner path would ship silently, so
          # assert on the packaged hook rather than trusting the plugins.
          ./dist/Frisky-*-x86_64.AppImage --appimage-extract >/dev/null

          grep -q "unset GTK_THEME" squashfs-root/apprun-hooks/zz-frisky-fixups.sh

          # Search rather than assume a path: the scanner and libraries land in
          # different directories depending on the distribution linuxdeploy ran
          # on, which is exactly why the hook probes several candidates.
          for lib in libgtk-4.so libadwaita-1.so libgstreamer-1.0.so; do
            find squashfs-root -name "$lib*" | grep -q . \
              || { echo "missing from the bundle: $lib"; exit 1; }
          done
          find squashfs-root -name gst-plugin-scanner -type f | grep -q . \
            || { echo "missing from the bundle: gst-plugin-scanner"; exit 1; }

          echo "bundled:"
          find squashfs-root \( -name "libgtk-4.so*" -o -name "libadwaita-1.so*" \
            -o -name gst-plugin-scanner \) -printf "  %P\n"
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: appimage-and-tarball
          path: dist/*

  archpkg:
    name: Arch package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - name: Prepare the build user
        run: |
          pacman -Syu --noconfirm git rust pacman-contrib \
            gtk4 libadwaita gstreamer gst-plugins-base gst-plugins-good \
            gst-plugins-bad gst-libav openssl
          # makepkg refuses to run as root.
          useradd -m builder
          chmod -R a+rw "$GITHUB_WORKSPACE"

      - name: Determine version
        id: version
        run: |
          ref="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${ref#v}" >> "$GITHUB_OUTPUT"

      - name: Build the package
        run: |
          cd build-aux
          # Pin the version and the source checksum for the tag being released.
          sed -i "s/^pkgver=.*/pkgver=${{ steps.version.outputs.version }}/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --noconfirm --syncdeps --skippgpcheck

          mkdir -p "$GITHUB_WORKSPACE/dist"
          # makepkg also emits a -debug- package carrying separated debug
          # symbols; that is not something to attach to a release.
          for pkg in ./*.pkg.tar.zst; do
            case "$pkg" in *-debug-*) continue;; esac
            cp "$pkg" "$GITHUB_WORKSPACE/dist/"
          done
          # The PKGBUILD itself ships too, for anyone who would rather build it.
          cp PKGBUILD "$GITHUB_WORKSPACE/dist/PKGBUILD"

      - name: Check the package contents
        run: |
          pkg=$(ls "$GITHUB_WORKSPACE"/dist/*.pkg.tar.zst)
          case "$pkg" in *-debug-*) echo "debug package leaked into dist"; exit 1;; esac
          tar -tf "$pkg" > listing
          for path in usr/bin/frisky-gtk \
                      usr/share/applications/io.github.eboye.Frisky.desktop \
                      usr/share/glib-2.0/schemas/io.github.eboye.Frisky.gschema.xml; do
            grep -qx "$path" listing || { echo "missing from package: $path"; exit 1; }
          done
          # Shipping a compiled schema cache would clash with every other
          # package that installs one; pacman's hook regenerates it.
          if grep -q "gschemas.compiled" listing; then
            echo "package must not ship gschemas.compiled"; exit 1
          fi
          echo "package contents look right"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: dist/*

  publish:
    name: Publish release
    needs: [flatpak, appimage, archpkg]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # Checkout first: it cleans the workspace, so downloading the artifacts
      # before it would silently delete them and publish a release with no
      # files attached.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-body.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check the artifacts survived
        run: |
          test -f artifacts/flatpak/frisky.flatpak
          ls artifacts/arch-package/*.pkg.tar.zst >/dev/null
          test -f artifacts/arch-package/PKGBUILD
          ls artifacts/appimage-and-tarball/*.AppImage >/dev/null
          ls artifacts/appimage-and-tarball/*.tar.gz >/dev/null
          find artifacts -type f -printf "  %P  %s bytes\n"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # A written intro with screenshots and install steps, followed by the
          # generated commit list — a bare changelog makes a poor landing page.
          body_path: .github/release-body.md
          append_body: true
          generate_release_notes: true
          files: |
            artifacts/flatpak/frisky.flatpak
            artifacts/appimage-and-tarball/*
            artifacts/arch-package/*
