name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Advisories land against dependencies that were fine when they merged, so
  # the audit below has to run on a clock as well as on changes.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

# Nothing here writes to the repository. Granting the token read access by
# default means a compromised build step cannot push, tag or publish.
permissions:
  contents: read

jobs:
  check:
    name: Build and test
    # Ubuntu 24.04 ships GTK 4.14 and libadwaita 1.5, which clear the crate
    # minimums, so no container is needed.
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-4-dev libadwaita-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libssl-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav \
            xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        # Scoped to this crate: a blanket RUSTFLAGS would also deny warnings in
        # dependencies, which we do not control.
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        # The player tests drive a real GStreamer pipeline and GTK wants a
        # display, though nothing is played aloud.
        run: xvfb-run -a cargo test --all --locked

  flatpak:
    name: Flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # Pinned to a commit rather than @master: this action runs privileged in a
      # container with access to the checkout, and the upstream repo publishes
      # no release tags to track instead.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          bundle: frisky.flatpak
          manifest-path: build-aux/io.github.eboye.Frisky.json
          cache-key: flatpak-builder-${{ github.sha }}

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: command -v cargo-audit || cargo install cargo-audit --locked

      # Fails on a vulnerability, not on merely unmaintained crates: the latter
      # is common in the GTK stack and is not something a release should stop
      # for. Deliberately not part of the release workflow, so an advisory
      # published mid-incident cannot block shipping the fix for it.
      - name: Audit
        run: cargo audit

  metadata:
    name: Validate metadata
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net data/io.github.eboye.Frisky.metainfo.xml

      - name: Validate desktop entry
        # The entry is D-Bus activatable and its service file is installed at
        # build time, so the reference to it is expected to be unresolvable here.
        run: desktop-file-validate data/io.github.eboye.Frisky.desktop
