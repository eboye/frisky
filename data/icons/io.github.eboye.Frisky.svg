<?xml version="1.0" encoding="UTF-8"?>
<!-- Frisky app icon.

     Original artwork: a waveform mark on the channel gradient, echoing the
     visualiser in the app itself. FRISKY's own logo is not reproduced here. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec9558"/>
      <stop offset="45%" stop-color="#de446d"/>
      <stop offset="65%" stop-color="#dd3b6f"/>
      <stop offset="100%" stop-color="#9a2977"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#brand)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#sheen)"/>

  <!-- Waveform bars, mirrored about the centre line. -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="30"  y="58" width="7" height="12" rx="3.5"/>
    <rect x="41"  y="48" width="7" height="32" rx="3.5"/>
    <rect x="52"  y="36" width="7" height="56" rx="3.5"/>
    <rect x="63"  y="44" width="7" height="40" rx="3.5"/>
    <rect x="74"  y="30" width="7" height="68" rx="3.5"/>
    <rect x="85"  y="46" width="7" height="36" rx="3.5"/>
    <rect x="96"  y="56" width="7" height="16" rx="3.5"/>
  </g>
</svg>
